<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator(CyberXSheild)</title>
    <link rel="stylesheet" href="./css/pg.css">
     <link rel="icon" href="./image and logos/(CyberXSheild) logo.png">
</head>
<body>

<div class="container">

    <h1>🛡️ Password Generator</h1>

    <p>Create a strong and secure password.</p>

    <label>Password Length</label>
    <input type="number" id="length" min="8" max="30" value="12">

    <br><br>

    <input type="checkbox" id="upper" checked>
    <label for="upper">Uppercase Letters</label><br>

    <input type="checkbox" id="lower" checked>
    <label for="lower">Lowercase Letters</label><br>

    <input type="checkbox" id="number" checked>
    <label for="number">Numbers</label><br>

    <input type="checkbox" id="special" checked>
    <label for="special">Special Characters</label><br><br>

    <button onclick="generatePassword()">Generate Password</button>

    <h3>Generated Password</h3>

    <input type="text" id="result" readonly>

    <br><br>

    <button onclick="copyPassword()">Copy Password</button>


            <button   onclick="window.location.href='index.html'"
    style="width: 40%; margin-left: 30%;height: 60px;margin-top: 100px; 
    background-color: rgb(46, 46, 154); color: white;font-size: 18px;"
    > 🏠 Go Home</button>
</div>
<script src="./java/passgenrator.js"></script>

</body>
</html>
