<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact(CyberXSheild)</title>
    <link rel="stylesheet" href="./css/contact.css">
     <link rel="icon" href="./image and logos/(CyberXSheild) logo.png">
</head>
<body>
    <div>
  <h2> User Details / Contact Form</h2>

<div class="user-details">

    <div>
        <label>Full Name:</label>
        <input type="text" id="name" placeholder="Enter your full name">
    </div>

    <br>

    <div>
        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter your email">
    </div>

    <br>

    <div>
        <label>Mobile Number:</label>
        <input type="tel" id="mobile" placeholder="Enter your mobile number">
    </div>

    <br>

    <div>
        <label>Age:</label>
        <input type="number" id="age" min="10" max="100" placeholder="Enter your age">
    </div>

    <br>

    <div>
        <label>Gender:</label>
        <select id="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </div>

    <br>

    <div>
        <label>College/School:</label>
        <input type="text" id="college" placeholder="Enter college name">
    </div>

    <br>

    <div>
        <label>Course:</label>
        <input type="text" id="course" placeholder="e.g. B.Tech CSE">
    </div>

    <br>

    <div>
        <label>State:</label>
        <input type="text" id="state" placeholder="Enter your State">
    </div>

    <br>
    
    <div>
        <label>City:</label>
        <input type="text" id="city" placeholder="Enter your city">
    </div>

    <br>

    <div>
        <label>How did you hear about this WebPage?</label>
        <select id="source">
            <option value="">Select</option>
            <option>College</option>
            <option>Friend</option>
            <option>Social Media</option>
            <option>Website</option>
            <option>Other</option>
        </select>
    </div>

    <br>

    <div>
        <label>Comments (Optional):</label>
        <textarea id="comments" rows="4" placeholder="Write your comments..."></textarea>
    </div>

    <br>

    <div>
        <button onclick="nextPage()">Next Page</button>
    </div>

</div>
    </div>
    

    
</body>
<script src="./java/contect.js"></script>
</html>
